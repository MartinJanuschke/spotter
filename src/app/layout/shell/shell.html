<div class="h-dvh flex flex-col bg-gray-50 overflow-hidden">
  <nav class="bg-white border-b border-gray-200 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 flex items-center gap-1 h-14">
      <span class="font-bold text-gray-900 mr-4 text-lg">⚽ {{ 'nav.title' | transloco }}</span>

      <!-- Desktop nav links -->
      <div class="hidden md:flex items-center gap-1">
        <a routerLink="/leaderboard" routerLinkActive="bg-blue-50 text-blue-700 font-semibold"
           class="px-3 py-2 rounded-md text-sm text-gray-600 hover:bg-gray-100 transition-colors">
          {{ 'nav.leaderboard' | transloco }}
        </a>
        <a routerLink="/games" routerLinkActive="bg-blue-50 text-blue-700 font-semibold"
           class="px-3 py-2 rounded-md text-sm text-gray-600 hover:bg-gray-100 transition-colors">
          {{ 'nav.games' | transloco }}
        </a>
        <a routerLink="/scores" routerLinkActive="bg-blue-50 text-blue-700 font-semibold"
           class="px-3 py-2 rounded-md text-sm text-gray-600 hover:bg-gray-100 transition-colors">
          {{ 'nav.scores' | transloco }}
        </a>
      </div>

      <div class="ml-auto flex items-center gap-1 text-xs font-medium">
        <button (click)="setLang('de')"
          [class.text-blue-700]="activeLang === 'de'"
          [class.font-bold]="activeLang === 'de'"
          class="px-2 py-1 rounded hover:bg-gray-100 text-gray-500 transition-colors">
          DE
        </button>
        <span class="text-gray-300">|</span>
        <button (click)="setLang('en')"
          [class.text-blue-700]="activeLang === 'en'"
          [class.font-bold]="activeLang === 'en'"
          class="px-2 py-1 rounded hover:bg-gray-100 text-gray-500 transition-colors">
          EN
        </button>
      </div>
    </div>
  </nav>

  <main class="flex-1 overflow-y-auto max-w-5xl w-full mx-auto px-4 py-4 md:py-6 pb-24 md:pb-6">
    <router-outlet />
  </main>

  <!-- Mobile bottom tab bar -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex z-50 safe-bottom">
    <a routerLink="/leaderboard" routerLinkActive="text-blue-600"
       class="flex-1 flex flex-col items-center py-2 text-gray-400 text-xs gap-0.5 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
      </svg>
      <span>{{ 'nav.leaderboard' | transloco }}</span>
    </a>
    <a routerLink="/games" routerLinkActive="text-blue-600"
       class="flex-1 flex flex-col items-center py-2 text-gray-400 text-xs gap-0.5 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span>{{ 'nav.games' | transloco }}</span>
    </a>
    <a routerLink="/scores" routerLinkActive="text-blue-600"
       class="flex-1 flex flex-col items-center py-2 text-gray-400 text-xs gap-0.5 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
      </svg>
      <span>{{ 'nav.scores' | transloco }}</span>
    </a>
  </nav>
</div>
