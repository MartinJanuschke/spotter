<div class="flex min-h-dvh justify-center bg-(--surface-sunken)">
  <div
    class="relative flex h-dvh w-full max-w-[440px] flex-col overflow-hidden border-x border-(--border-subtle) bg-(--bg-app) shadow-(--shadow-lg)"
    [class]="isRangliste() ? 'lg:max-w-[960px]' : ''"
  >
    <!-- brand strip -->
    <header
      class="flex flex-none items-center justify-between border-b border-(--border-subtle) bg-(--surface-card) px-5 pt-3.5 pb-2.5"
    >
      <img src="assets/logo-lockup.svg" alt="Spotter" class="block h-[22px]" />
      <span
        class="inline-flex items-center gap-[7px] rounded-(--r-pill) bg-(--surface-sunken) px-[11px] py-1.5 font-body text-xs font-semibold text-(--text-muted)"
      >
        <span
          class="h-1.5 w-1.5 rounded-full bg-(--live-500) [box-shadow:0_0_0_3px_var(--live-50)]"
        ></span>
        {{ 'shell.live' | transloco }}
      </span>
    </header>

    <!-- scroll area -->
    <main class="sp-scroll flex-1 overflow-x-hidden overflow-y-auto">
      <router-outlet />
    </main>

    <sp-toast-host />
    <sp-confirm-dialog />

    <!-- tab bar -->
    <nav
      class="grid h-[74px] flex-none grid-cols-5 items-start border-t border-(--border-subtle) bg-(--surface-card) px-1.5 pt-[9px] pb-[calc(10px+env(safe-area-inset-bottom))]"
    >
      @for (tab of tabs; track tab.path) {
        <a
          [routerLink]="tab.path"
          routerLinkActive
          #rla="routerLinkActive"
          class="flex cursor-pointer flex-col items-center gap-[5px] [-webkit-tap-highlight-color:transparent]"
        >
          @if (tab.accent) {
            <span
              class="relative -mt-4 flex h-[50px] w-[50px] items-center justify-center rounded-full bg-(--red-500) shadow-(--shadow-accent)"
            >
              <svg [lucideIcon]="tab.icon" [size]="24" [strokeWidth]="2.2" class="text-white"></svg>
              @if (tab.locked && !pinService.unlocked()) {
                <span
                  class="absolute -top-0.5 -right-1 flex h-[16px] w-[16px] items-center justify-center rounded-full border border-(--border-subtle) bg-(--surface-card)"
                >
                  <svg lucideLock [size]="9" [strokeWidth]="2.6" class="text-(--ink-900)"></svg>
                </span>
              }
            </span>
            <span class="font-body text-[10px] font-semibold text-(--accent-text)">
              {{ tab.labelKey | transloco }}
            </span>
          } @else {
            <span class="relative flex h-[30px] w-[30px] items-center justify-center">
              <svg
                [lucideIcon]="tab.icon"
                [size]="22"
                [strokeWidth]="rla.isActive ? 2.4 : 2"
                [class]="rla.isActive ? 'text-(--ink-900)' : 'text-(--n-400)'"
              ></svg>
              @if (tab.locked && !pinService.unlocked()) {
                <span
                  class="absolute -top-0.5 -right-1 flex h-[16px] w-[16px] items-center justify-center rounded-full border border-(--border-subtle) bg-(--surface-card)"
                >
                  <svg lucideLock [size]="9" [strokeWidth]="2.6" class="text-(--ink-900)"></svg>
                </span>
              }
            </span>
            <span
              class="font-body text-[10px] font-semibold"
              [class]="rla.isActive ? 'text-(--ink-900)' : 'text-(--n-400)'"
            >
              {{ tab.labelKey | transloco }}
            </span>
          }
        </a>
      }
    </nav>
  </div>
</div>
