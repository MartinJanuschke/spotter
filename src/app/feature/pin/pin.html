<div class="px-5 pt-12 pb-7">
  <div class="text-center">
    <span
      class="mx-auto flex h-[64px] w-[64px] items-center justify-center rounded-[18px] bg-(--ink-900) shadow-(--shadow-lg)"
    >
      <svg lucideLock [size]="26" [strokeWidth]="2.2" class="text-white"></svg>
    </span>
    <div class="sp-overline mt-5 !text-(--accent-text)">{{ 'pin.eyebrow' | transloco }}</div>
    <h1
      class="mt-1.5 font-display text-[26px] font-bold tracking-(--ls-tight) text-(--text-strong)"
    >
      {{ 'pin.title' | transloco }}
    </h1>
    <p class="mt-1 text-[13.5px] text-(--text-muted)">{{ 'pin.hint' | transloco }}</p>
  </div>

  <div class="mx-auto mt-8 max-w-[300px]">
    <input
      class="sp-input sp-num !h-[64px] text-center !text-[28px] !font-semibold tracking-[.3em]"
      type="password"
      inputmode="numeric"
      autocomplete="off"
      [placeholder]="'pin.placeholder' | transloco"
      [ngModel]="pin()"
      (ngModelChange)="setPin($event)"
      (keydown.enter)="unlock()"
    />
    <div class="mt-4">
      <sp-button variant="accent" size="lg" [block]="true" [disabled]="busy()" (pressed)="unlock()">
        {{ 'pin.unlock' | transloco }}
      </sp-button>
    </div>
  </div>
</div>
